server:
  port: ${server.port}

logging:
  level:
    root: INFO # Default logging level for all loggers
    org.apache.kafka: WARN # Set the log level for all Apache Kafka client libraries to WARN
    org.springframework.kafka: DEBUG # Set the log level for Spring Kafka components to DEBUG
    com.ecms.*: DEBUG # Set the log level for your application's specific Kafka package

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Local Database
  datasource:
    url: ${database-url}
    username: ${database-username}
    password: ${database-password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Docker Datasource
#  datasource:
#    url: ${database-url}
#    username: ${database-username}
#    password: ${database-password}
#    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    producer:
      bootstrap-servers: ${kafka-producer-bootstrap-servers}
      group_id: ${kafka-producer-group-id}
      key-serializer: ${kafka-producer-key-serializer}
      value-serializer: ${kafka-producer-value-serializer}
      properties:
        spring.json.trusted.packages: '*'

    consumer:
      bootstrap-servers: ${kafka-consumer-bootstrap-server}
      group_id: ${kafka-consumer-group-id}
      auto-offset-reset: ${kafka-consumer-auto-offset-reset}
      key-deserializer: ${kafka-consumer-key-deserializer}
      value-deserializer: ${kafka-consumer-value-deserializer}
      properties:
        spring.json.trusted.packages: '*'

razorpay:
  key:
    id: ${razorpay-key-id}
  secret:
    key: ${razorpay-secret-key}
